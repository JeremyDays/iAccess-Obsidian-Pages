name: Deploy encrypted GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Verify that no plaintext export was committed
        shell: bash
        run: |
          test -f secure/manifest.bin
          test -f secure/build.json
          test -f index.html
          test ! -d notes
          test ! -d api
          test ! -d assets/vault
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v5
        id: deployment
